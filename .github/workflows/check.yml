name: Check plugins

# Every pull request: the app's own format checks, the library details and
# layout, a personal-data scan, and a higher version for changed plugins.
# Runs with a read-only token, so pull requests from forks are safe.
on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: head

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          path: base

      - name: Get the checker
        run: |
          curl -fsSL -o "$RUNNER_TEMP/wlb-plugin-check" https://wealthlogbook.com/tools/wlb-plugin-check-linux-x86_64
          chmod +x "$RUNNER_TEMP/wlb-plugin-check"

      - name: Check
        run: '"$RUNNER_TEMP/wlb-plugin-check" check head --base base'
